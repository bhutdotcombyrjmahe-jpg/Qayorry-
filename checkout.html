<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>চেকআউট — Qayorra Fragrance</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<div class="container" style="padding-top:20px;">
  <div class="form-page" style="max-width:600px;">
    <h2>অর্ডার তথ্য দিন</h2>
    <div id="orderSummaryBox" class="cart-summary" style="margin-bottom:20px;"></div>
    <form id="checkoutForm">
      <div class="form-group">
        <label>পূর্ণ নাম *</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>ফোন নাম্বার *</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="form-group">
        <label>সম্পূর্ণ ঠিকানা *</label>
        <textarea id="address" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label>ডেলিভারি এলাকা *</label>
        <div class="radio-row">
          <label><input type="radio" name="area" value="dhaka" checked> ঢাকার ভেতরে (৳100)</label>
          <label><input type="radio" name="area" value="outside"> ঢাকার বাইরে (৳150)</label>
        </div>
      </div>
      <div class="form-group">
        <label>পেমেন্ট মেথড</label>
        <input type="text" value="ক্যাশ অন ডেলিভারি (Full COD)" disabled>
      </div>
      <button type="submit" class="btn btn-gold btn-block">অর্ডার কনফার্ম করুন</button>
      <p class="error-msg" id="errMsg"></p>
    </form>
  </div>
</div>

<div id="floatingBtns" class="floating-btns"></div>
<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/common.js"></script>
<script>
const cart = getCart();
if (!cart.length) window.location.href = '/cart.html';

function renderSummary() {
  const area = document.querySelector('input[name=area]:checked').value;
  const delivery = area === 'dhaka' ? 100 : 150;
  const subtotal = cartTotal();
  document.getElementById('orderSummaryBox').innerHTML = `
    ${cart.map(c => `<div class="summary-row"><span>${c.title} × ${c.qty}</span><span>৳${c.price * c.qty}</span></div>`).join('')}
    <div class="summary-row"><span>ডেলিভারি চার্জ</span><span>৳${delivery}</span></div>
    <div class="summary-row total"><span>সর্বমোট</span><span>৳${subtotal + delivery}</span></div>
  `;
}
document.querySelectorAll('input[name=area]').forEach(r => r.addEventListener('change', renderSummary));
renderSummary();

document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('errMsg');
  errEl.style.display = 'none';
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const area = document.querySelector('input[name=area]:checked').value;

  if (!name || !phone || !address) {
    errEl.textContent = 'দয়া করে সব তথ্য পূরণ করুন।';
    errEl.style.display = 'block';
    return;
  }

  const items = cart.map(c => ({ productId: c.id, title: c.title, price: c.price, qty: c.qty }));
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, name, phone, address, area })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'ত্রুটি হয়েছে');
    sessionStorage.setItem('qayorra_purchased', '1');
    localStorage.removeItem('qayorra_cart');
    window.location.href = '/thank-you.html?orderId=' + data.order.id;
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
