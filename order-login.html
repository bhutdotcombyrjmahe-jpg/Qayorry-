<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার প্যানেল লগইন — Qayorra Fragrance</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="siteHeader" class="site-header"></header>

<div class="form-page">
  <h2>অর্ডার প্যানেল লগইন</h2>
  <form id="loginForm" data-redirect="/orders.html">
    <div class="form-group">
      <label>ফোন নাম্বার</label>
      <input type="text" id="phone" required placeholder="01XXXXXXXXX">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-gold btn-block">লগইন করুন</button>
    <p class="error-msg" id="errMsg"></p>
  </form>
</div>

<div id="floatingBtns" class="floating-btns"></div>
<footer id="siteFooter" class="site-footer"></footer>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
